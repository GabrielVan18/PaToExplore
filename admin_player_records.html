<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Records - PaToExplore</title>

    <style>
        /* ============================================================
           ASSETS - parehong path sa login.html (palitan kung iba)
           ============================================================ */
       @font-face {
    font-family: "Tildunk";
    src: url("assets/fonts/tildunk.otf") format("opentype");
    font-display: swap;
}

:root {
    --bg-village: url("assets/images/bg.png");
    --banner-img: url("assets/images/ui/wood/banner_hexagon.png");
    --plank-img:  url("assets/images/ui/wood/long_button.png");

    /* Kulay galing sa MenuScene */
    --overlay:  rgba(26, 18, 6, 0.32);
    --cream:    #fff8e7;
    --cream-2:  #f5e2c8;
    --brown:    #3b2410;
    --gold:     #d8b04a;
    --panel:    #20222a;
    --muted:    #c9cdd6;
    --font: "Tildunk", Georgia, serif;
}

        * { box-sizing: border-box; }

        html, body { margin: 0; min-height: 100%; }

        body {
            font-family: var(--font);
            color: var(--cream);
            background:
                linear-gradient(var(--overlay), var(--overlay)),
                var(--bg-village) center / cover no-repeat fixed,
                linear-gradient(#6b8f4e, #3f5a2c);
            padding: 24px 16px 40px;
        }

        .stage {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ---------- Title banner ---------- */
        .banner {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 460 / 166;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--banner-img) center / 100% 100% no-repeat;
        }
        .banner.no-img {
            background: linear-gradient(180deg, #c99a4a, #8a5a22);
            border: 4px solid var(--brown);
            border-radius: 14px;
        }
        .banner h1 {
            margin: 0;
            font-size: clamp(26px, 8vw, 40px);
            font-weight: bold;
            color: var(--cream);
            letter-spacing: 1px;
            text-align: center;
            text-shadow:
                -3px -3px 0 var(--brown), 3px -3px 0 var(--brown),
                -3px  3px 0 var(--brown), 3px  3px 0 var(--brown),
                 0   -3px 0 var(--brown), 0    3px 0 var(--brown),
                -3px  0   0 var(--brown), 3px  0   0 var(--brown),
                 2px  5px 6px rgba(0,0,0,.4);
        }
        .tagline {
            margin: 6px 0 18px;
            font-size: 18px;
            color: var(--cream-2);
            text-shadow: 1px 2px 3px rgba(0,0,0,.4);
            text-align: center;
        }

        /* ---------- Buttons ---------- */
        .btn {
            font-family: var(--font);
            font-weight: bold;
            color: var(--cream);
            cursor: pointer;
            border: 3px solid var(--brown);
            text-shadow: 2px 2px 0 var(--brown);
            transition: transform .08s, filter .15s;
        }
        .btn:hover  { filter: brightness(1.12); }
        .btn:active { transform: translateY(2px); }
        .btn:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }

        .btn-primary {
            padding: 10px 18px;
            font-size: 16px;
            background:
                var(--plank-img) center / 100% 100% no-repeat,
                linear-gradient(180deg, #d9a74f 0%, #b27a2c 55%, #8a5a22 100%);
            box-shadow: inset 0 2px 0 rgba(255,235,180,.55), inset 0 -4px 0 rgba(59,36,16,.45);
        }

        .toolbar {
            width: 100%;
            margin-bottom: 14px;
        }

        /* ---------- Panel ---------- */
        .panel {
            width: 100%;
            background: var(--panel);
            border: 3px solid var(--gold);
            padding: 22px 22px 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.45);
        }
        .panel h2 {
            margin: 0 0 4px;
            text-align: center;
            font-size: 22px;
            font-weight: normal;
            color: var(--cream);
        }
        .panel .sub {
            margin: 0 0 16px;
            text-align: center;
            font-size: 12px;
            font-style: italic;
            color: var(--muted);
        }

        #player-name {
            margin: 0 0 6px;
            text-align: center;
            font-size: 20px;
            font-weight: normal;
            color: var(--cream);
        }

        .message {
            min-height: 18px;
            margin: 0 0 8px;
            text-align: center;
            font-size: 13px;
            color: #ffd36b;
        }

        /* ---------- Tables ---------- */
        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #2a2d36;
        }
        th, td {
            border: 2px solid #555a66;
            padding: 10px 12px;
            text-align: center;
            font-size: 14px;
            color: var(--cream);
        }
        th {
            background: #33363f;
            color: var(--gold);
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
        }
        tbody tr:hover td { background: #353945; }

        @media (prefers-reduced-motion: reduce) {
            .btn { transition: none; }
        }
    </style>
</head>

<body>

    <main class="stage">
        <div class="banner" id="banner">
            <h1>PLAYER RECORDS</h1>
        </div>
        <p class="tagline">Where the river remembers</p>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="history.back()">&larr; Back to Players</button>
        </div>

        <section class="panel">
            <h2 id="player-name">Loading player...</h2>
            <p class="sub">Player summary</p>
            <p id="status" class="message" role="alert"></p>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Registered</th>
                            <th>Last Login</th>
                            <th>Chapters Done</th>
                            <th>Best Score</th>
                            <th>Saved Records</th>
                            <th>Last Played</th>
                        </tr>
                    </thead>
                    <tbody id="player-details"></tbody>
                </table>
            </div>
        </section>

        <section class="panel">
            <h2>Recent Activity</h2>
            <p class="sub">Latest saved game sessions</p>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Chapter Finished</th>
                            <th>Score</th>
                            <th>Time in Session</th>
                            <th>Date / Time</th>
                        </tr>
                    </thead>
                    <tbody id="activity-details"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // Kung hindi ma-load ang banner image, gumamit ng CSS wood fallback
        (function () {
            const src = getComputedStyle(document.documentElement)
                .getPropertyValue('--banner-img')
                .match(/url\(["']?(.*?)["']?\)/);
            if (!src) return;
            const img = new Image();
            img.onerror = () => document.getElementById('banner').classList.add('no-img');
            img.src = src[1];
        })();

        async function loadPlayerRecords() {
            const id = new URLSearchParams(location.search).get('id');

            if (!id || !/^\d+$/.test(id)) {
                document.getElementById('player-name').textContent =
                    'Invalid player ID';
                return;
            }

            try {
                const res = await fetch(
                    'api/admin_player_records.php?id=' +
                    encodeURIComponent(id),
                    { cache: 'no-store' }
                );

                if (res.status === 401 || res.status === 403) {
                    location.href = 'login.html';
                    return;
                }

                if (!res.ok) {
                    throw new Error('Could not load player records.');
                }

                const data = await res.json();

                if (!data.success || !data.player) {
                    throw new Error('Player not found.');
                }

                const p = data.player;

                document.getElementById('player-name').textContent =
                    'Username: ' + p.username;

                const details = document.getElementById('player-details');
                details.replaceChildren();

                const row = document.createElement('tr');

                [
                    p.created_at || '-',
                    p.last_login || 'Never',
                    (p.chapters_done ?? 0) + ' / 6',
                    p.best_score ?? 0,
                    p.records ?? 0,
                    p.last_played || '-'
                ].forEach(value => {
                    const td = document.createElement('td');
                    td.textContent = value;
                    row.appendChild(td);
                });

                details.appendChild(row);

                const activity =
                    document.getElementById('activity-details');
                activity.replaceChildren();

                if (!data.recent || data.recent.length === 0) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');

                    td.colSpan = 4;
                    td.textContent = 'No game records saved yet.';

                    tr.appendChild(td);
                    activity.appendChild(tr);
                    return;
                }

                data.recent.forEach(r => {
                    const tr = document.createElement('tr');
                    const seconds = Number(r.time_played_seconds) || 0;

                    [
                        r.chapter_key || '-',
                        r.score ?? 0,
                        Math.floor(seconds / 60) + 'm ' +
                            (seconds % 60) + 's',
                        r.played_at || '-'
                    ].forEach(value => {
                        const td = document.createElement('td');
                        td.textContent = value;
                        tr.appendChild(td);
                    });

                    activity.appendChild(tr);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('player-name').textContent =
                    'Unable to load records.';
                document.getElementById('status').textContent =
                    error.message || '';
            }
        }

        loadPlayerRecords();
    </script>

</body>
</html>
